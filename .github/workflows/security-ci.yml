name: Security CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        env:
          MONGODB_URI: mongodb://localhost:27017/test
          REDIS_URL: redis://localhost:6379/0
          RAZORPAY_KEY_ID: rzp_test
          RAZORPAY_KEY_SECRET: test-secret
        run: python -m pytest __tests__/ -q

      - name: Bandit SAST
        run: bandit -r src api -ll

      - name: pip-audit dependency scan
        run: pip-audit -r requirements.txt

      - name: Semgrep
        run: semgrep --config p/owasp-top-ten --error src api

      - name: Generate SBOM
        run: |
          cyclonedx-py requirements -i requirements.txt -o sbom.cdx.json
          test -s sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    runs-on: ubuntu-latest
    needs: test-and-security
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t chokmoki-serverless:ci .
      - name: Trivy container scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: chokmoki-serverless:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
