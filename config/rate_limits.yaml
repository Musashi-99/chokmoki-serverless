rules:
  - id: admin_login_ip
    match:
      methods: [POST]
      paths: [/api/admin/login]
    # NOTE: capacity == burst (see RateLimitBucket.capacity). burst is the number
    # of immediate attempts allowed; rate/window is the refill speed. Account
    # lockout (LOGIN_MAX_FAILED_ATTEMPTS) is the real brute-force defense, so
    # these only need to stop flooding, not legitimate interactive logins.
    buckets:
      - scope: ip
        rate: 30
        window: 15m
        burst: 10
      - scope: email
        field: email
        rate: 15
        window: 15m
        burst: 5

  # Public-facing checkout. burst was 2 with a 5/hour refill — a real
  # customer retrying a failed payment, or two people checking out from the
  # same home/office IP, could get blocked. Fraud/abuse is caught by
  # FraudDetectionService + idempotency, not this — this is just a volume
  # cap, so it can afford to be generous.
  - id: orders
    match:
      methods: [POST]
      paths: [/api/orders, /]
      operations: [order.create, order.initiate, order.verifyPayment]
    buckets:
      - scope: ip
        rate: 30
        window: 1h
        burst: 10
      - scope: email
        field: userEmail
        rate: 10
        window: 1h
        burst: 5

  # "My Orders" lookup (email + phone, no account/auth). Tight cap — this
  # is the one public endpoint that returns another person's order data if
  # both fields are guessed, so it needs to resist brute-forcing far more
  # than a normal form submit.
  - id: orders_lookup
    match:
      methods: [POST]
      paths: [/api/orders/lookup]
    buckets:
      - scope: ip
        rate: 10
        window: 1h
        burst: 5

  # Public contact form. burst was 1 with 1/hour per email — a single
  # legitimate resubmission (typo fix, "did that send?") would get blocked.
  # Customer login OTP (phone via MSG91 or email via Brevo — both submit as
  # `identifier`). field: identifier reuses the generic "email" scope
  # mechanism (src/plugins/rate_limit_config.py) which reads any named body
  # field — no new scope type needed.
  #
  # burst was 2/rate 5 per hour — the frontend's own resend cooldown is 30s
  # (LoginForm.tsx's `resendIn` timer), which implicitly promises "you can
  # resend every 30s", but burst=2 only allows 2 immediate sends before
  # falling back to a 12-minute refill cadence (rate 5/hour). A real
  # customer whose first SMS/email is slow or lost — hitting resend a 3rd
  # time after ~60-90s, exactly as the UI invites them to — got a 429 and
  # locked out for up to 12 minutes. Root cause of the "many users get 429"
  # reports (confirmed against production logs: every recent 429 was on
  # this exact endpoint). burst=5 covers a realistic string of resends
  # (~2.5 min of 30s-cooldown clicking) while rate=10/hour still caps
  # sustained abuse meaningfully below the real abuse threshold.
  - id: otp_request
    match:
      methods: [POST]
      paths: [/api/auth/otp/request]
    buckets:
      - scope: ip
        rate: 40
        window: 1h
        burst: 12
      - scope: email
        field: identifier
        rate: 10
        window: 1h
        burst: 5

  # OTP codes are short (4-6 digits) — this is the actual brute-force
  # defense for /api/auth/otp/verify. otp_request throttles how many codes
  # get sent; this throttles how many guesses one identifier gets against
  # whichever code was last sent. Paired with customer OTP lockout.
  - id: otp_verify
    match:
      methods: [POST]
      paths: [/api/auth/otp/verify]
    buckets:
      - scope: ip
        rate: 20
        window: 15m
        burst: 8
      - scope: email
        field: identifier
        rate: 8
        window: 15m
        burst: 5

  # Public, unauthenticated coupon-code probe surface. code-scope bucket
  # guards against brute-forcing a specific coupon code, not just volume.
  - id: coupons_preview
    match:
      methods: [POST]
      paths: [/api/coupons/preview]
    buckets:
      - scope: ip
        rate: 20
        window: 1h
        burst: 8
      - scope: email
        field: code
        rate: 10
        window: 1h
        burst: 5

  - id: contact
    match:
      methods: [POST]
      paths: [/api/contact, /]
      operations: [contact.create]
    buckets:
      - scope: ip
        rate: 20
        window: 1h
        burst: 5
      - scope: email
        field: email
        rate: 5
        window: 1h
        burst: 2

  # Public newsletter signup. burst was 1 with 3/day per IP — a shared
  # office/campus/cafe IP could only see 3 signups a day total.
  - id: newsletter
    match:
      methods: [POST]
      paths: [/api/newsletter, /]
      operations: [newsletter.subscribe]
    buckets:
      - scope: ip
        rate: 20
        window: 24h
        burst: 5
      - scope: email
        field: email
        rate: 2
        window: 24h
        burst: 1

  # F-14: cap public analytics writes per IP so trackEvent/trackMetric cannot
  # be used to flood/poison dashboards. Validation (allowlists + bounds) lives
  # in src/cqrs/param_models.py; this is the volume control.
  - id: analytics_write
    match:
      methods: [POST]
      paths: [/]
      operations: [analytics.trackEvent, analytics.trackMetric]
    buckets:
      - scope: ip
        rate: 120
        window: 1m
        burst: 30

  - id: product_search
    match:
      methods: [GET]
      paths: [/api/products]
    buckets:
      - scope: ip
        rate: 60
        window: 1m
        burst: 20

  - id: admin_api
    match:
      methods: ["*"]
      paths: [/api/admin/*]
    # The full-site export fetches every section + downloads every asset through
    # the admin API. Burst must cover at least section fetches + asset downloads
    # in one export run, or sites with many photos get throttled mid-export.
    buckets:
      - scope: ip
        rate: 500
        window: 1m
        burst: 200
      - scope: admin
        rate: 500
        window: 1m
        burst: 200

  - id: admin_upload
    match:
      methods: [POST]
      paths: [/api/admin/upload]
    buckets:
      - scope: ip
        rate: 30
        window: 1m
        burst: 10
      - scope: admin
        rate: 20
        window: 1m
        burst: 5

  # Webhooks are already protected at the application layer (HMAC signature
  # for Razorpay, x-api-key for Shiprocket) — rate limiting here is only a
  # volume/DoS backstop, not a security control, so it can be generous enough
  # to never realistically trip on legitimate delivery + retry traffic from
  # either provider's own servers.
  - id: webhook_razorpay
    match:
      methods: [POST]
      paths: [/webhook/razorpay]
    buckets:
      - scope: ip
        rate: 6000
        window: 1m
        burst: 600

  - id: webhook_shiprocket
    match:
      methods: [GET, POST]
      paths: [/webhook/courier-updates]
    buckets:
      - scope: ip
        rate: 6000
        window: 1m
        burst: 600

  # Public media proxy (R2 images served through our own domain). A first
  # page view loads dozens of images at once and objects are immutable-cached
  # after that, so this needs a much higher burst than ordinary GETs — the
  # volume cap only exists to stop scripted mass-downloading.
  - id: media
    match:
      methods: [GET]
      paths: [/media/*]
    buckets:
      - scope: ip
        rate: 3000
        window: 1m
        burst: 1000

  - id: public_get
    match:
      methods: [GET]
      paths: ["*"]
    buckets:
      - scope: ip
        rate: 400
        window: 3m
        burst: 400

  - id: public_post_fallback
    match:
      methods: [POST]
      paths: ["*"]
    buckets:
      - scope: ip
        rate: 400
        window: 3m
        burst: 400
